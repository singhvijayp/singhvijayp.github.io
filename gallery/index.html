<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery • Vijay Pratap Singh</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <button class="mode-toggle" id="modeToggle" aria-label="Toggle color mode">
      light mode
    </button>

    <main class="page">
      <a href="/" class="back-link">Back</a>

      <h1 class="page-title">Gallery</h1>
      <p class="page-description">
        A small selection of photos. Replace the placeholders with your own
        images inside <code>assets/images/</code>.
      </p>

      <span class="section-label">Photos</span>

      <div class="gallery-grid">
        <div class="gallery-item">
          <img src="/assets/images/photo-1.jpg" alt="Gallery photo 1" />
        </div>
        <div class="gallery-item">
          <img src="/assets/images/photo-2.jpg" alt="Gallery photo 2" />
        </div>
        <div class="gallery-item">
          <img src="/assets/images/photo-3.jpg" alt="Gallery photo 3" />
        </div>
      </div>
    </main>

    <script src="/js/script.js"></script>
  </body>
</html>
